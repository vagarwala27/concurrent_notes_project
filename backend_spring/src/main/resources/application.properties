# Server configuration
server.port=8000

# H2 Database
spring.datasource.url=jdbc:h2:file:./data/notesdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# GraphQL
spring.graphql.graphiql.enabled=true
spring.graphql.graphiql.path=/graphiql
spring.graphql.path=/graphql
spring.graphql.schema.introspection.enabled=true
spring.graphql.cors.allowed-origins=http://localhost:3000
spring.graphql.cors.allowed-methods=GET,POST

# gRPC
grpc.server.port=9090

# "note-summary-service" matches the @GrpcClient("note-summary-service") annotation in your Worker
grpc.client.note-summary-service.address=static://localhost:9090
grpc.client.note-summary-service.negotiation-type=plaintext