syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.notes.app.grpc";
option java_outer_classname = "NoteSummaryProto";

service NoteSummaryService {
    // RPC method to get a summary of a note
    rpc GetNoteSummary (NoteSummaryRequest) returns (NoteSummaryResponse);
}

message NoteSummaryRequest {
  string note_id = 1;
  string content = 2;
}

message NoteSummaryResponse {
  string summary = 1;
}